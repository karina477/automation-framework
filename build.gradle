plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'
}

group = 'com.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-jdbc:3.2.4'
    implementation 'org.springframework.boot:spring-boot-starter-json:3.2.4'
    implementation 'com.codeborne:selenide:7.2.1'
    implementation 'io.rest-assured:rest-assured:5.4.0'
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'io.qameta.allure:allure-selenide:2.27.0'
    implementation 'io.qameta.allure:allure-rest-assured:2.27.0'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.2.4'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testRuntimeOnly 'io.qameta.allure:allure-junit5:2.27.0'
    testImplementation 'org.aspectj:aspectjweaver:1.9.22'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()

    doFirst {
        def weaver = configurations.testRuntimeClasspath.find { it.name.contains("aspectjweaver") }
        if (weaver) {
            jvmArgs "-javaagent:${weaver.absolutePath}"
        }
    }

    systemProperty 'allure.results.directory', 'build/allure-results'
    systemProperties(System.getProperties())

    testLogging {
        showExceptions = true
        showCauses = false
        showStackTraces = false
        exceptionFormat = 'short'
    }
}

allprojects {
    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xmaxerrs" << "500"
    }
}